schema_version: 1

context:
  version: "5.0.1"

package:
  name: django-grappelli
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/django-grappelli/django_grappelli-${{ version }}.tar.gz
  sha256: f291d5c596b0e1fc1e0e1bf819f472503c194a4ae3dfdd35b5b4c0a3bb67c101

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69.3.0
    - pip
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - grappelli
        - grappelli.templatetags
        - grappelli.views
        - grappelli.dashboard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A jazzy skin for the Django Admin-Interface.
  license: MIT AND BSD-3-Clause AND LGPL-2.1-only
  license_file:
    - LICENSE
    - grappelli/static/grappelli/tinymce/jscripts/tiny_mce/license.txt
    - grappelli/static/grappelli/jquery/LICENSE.txt
    - grappelli/static/grappelli/jquery/LICENSE-JQUERY.txt
    - grappelli/static/grappelli/jquery/ui/LICENSE.txt
  homepage: http://django-grappelli.readthedocs.org
  repository: https://github.com/sehmaschine/django-grappelli
  documentation: https://pythonhosted.org/django-grappelli/

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
